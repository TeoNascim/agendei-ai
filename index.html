<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendei AI — Plataforma de Agendamentos Inteligentes</title>
  <meta name="description" content="Agende serviços com profissionais incríveis usando Inteligência Artificial. Rápido, fácil e inteligente." />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    window.process = { env: { API_KEY: "" } };
  </script>

  <style>
    :root {
      --brand:        #5B4FE8;          /* Indigo vibrante */
      --brand-dark:   #3730A3;          /* Indigo profundo */
      --brand-light:  #ECEAFE;          /* Indigo muito claro */
      --accent:       #F59E0B;          /* Âmbar/dourado */
      --accent-light: #FEF3C7;          /* Âmbar claro */
      --success:      #10B981;          /* Esmeralda */
      --bg:           #F8F8FF;          /* Branco-azulado suave */
      --surface:      #FFFFFF;
      --text-1:       #0D0B26;          /* Quase preto, tom indigo */
      --text-2:       #64748B;          /* Slate */
      --border:       #E2E8F0;
      --hero-from:    #13104A;          /* Azul-noite profundo */
      --hero-mid:     #2D2787;          /* Indigo médio */
      --hero-to:      #1a1060;          /* Roxo-noite */
      --shadow-sm:    0 2px 12px rgba(91,79,232,0.08);
      --shadow-md:    0 6px 28px rgba(91,79,232,0.14);
      --shadow-lg:    0 12px 48px rgba(91,79,232,0.22);
      --shadow-card:  0 4px 20px rgba(13,11,38,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

    /* Animações */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.93); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes floatBlob {
      0%, 100% { transform: translateY(0) scale(1); }
      50%       { transform: translateY(-20px) scale(1.06); }
    }

    .animate-fade-up  { animation: fadeUp  0.4s ease both; }
    .animate-scale-in { animation: scaleIn 0.3s ease both; }
    .animate-slide-in { animation: slideIn 0.28s ease both; }

    /* Gradientes */
    .brand-gradient {
      background: linear-gradient(135deg, var(--brand) 0%, #8B5CF6 100%);
    }
    .brand-gradient-text {
      background: linear-gradient(135deg, var(--brand) 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-gradient {
      background: linear-gradient(140deg, var(--hero-from) 0%, var(--hero-mid) 55%, var(--hero-to) 100%);
    }
    .accent-gradient {
      background: linear-gradient(135deg, var(--accent) 0%, #FBBF24 100%);
    }

    /* Cards */
    .card-hover {
      transition: transform 0.32s cubic-bezier(.22,.68,0,1.2), box-shadow 0.32s ease;
    }
    .card-hover:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }

    /* Glass */
    .glass {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .glass-dark {
      background: rgba(19,16,74,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Input */
    .input-brand:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(91,79,232,0.2);
      border-color: var(--brand);
    }

    /* Blob decorativo */
    .hero-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: floatBlob 8s ease-in-out infinite;
    }

    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

    .typing-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #9CA3AF;
      animation: pulse-dot 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
